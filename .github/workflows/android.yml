name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip TESTLAB-Stage1-Source-fixed.zip -d project_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: |
          GRADLE_DIR=$(dirname $(find project_src -name "gradle" | head -n 1))
          cd "$GRADLE_DIR"
          chmod +x ./gradle
          ./gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: project_src/**/app/build/outputs/apk/debug/*.apk
